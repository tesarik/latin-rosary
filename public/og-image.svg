<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link-preview image (Open Graph), rendered to og-image.png with Inkscape
       (see CLAUDE.md). The app icon's art, art/icon-source.png, fills the left
       square, its right edge fading into the same blue field. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.82" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="edge" maskContentUnits="userSpaceOnUse">
      <rect width="630" height="630" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="#27486C"/>
  <image width="630" height="630" xlink:href="../art/icon-source.png" mask="url(#edge)"/>

  <g fill="#F4EFE4" font-family="EB Garamond">
    <text x="640" y="255" font-size="112" font-weight="500">Rosarium</text>
    <text x="640" y="365" font-size="112" font-weight="500">Latinum</text>
    <rect x="644" y="403" width="120" height="3" fill="#E0B44A"/>
    <text x="640" y="465" font-size="35" font-style="italic" fill-opacity="0.9">The Latin rosary · Latinský růženec</text>
  </g>
</svg>
