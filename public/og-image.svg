<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link-preview image (Open Graph), rendered to og-image.png with Inkscape
       (see CLAUDE.md). The heart is the app icon's art, art/icon-heart.png,
       on the icon's blue-grey field, lightening behind the heart. -->
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="315" cy="315" r="900">
      <stop offset="0" stop-color="#4C628A"/>
      <stop offset="0.6" stop-color="#1E2C4A"/>
      <stop offset="1" stop-color="#1E2C4A"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#field)"/>
  <image x="20" y="20" width="590" height="590" xlink:href="../art/icon-heart.png"/>

  <g fill="#F4EFE4" font-family="EB Garamond">
    <text x="620" y="255" font-size="112" font-weight="500">Rosarium</text>
    <text x="620" y="365" font-size="112" font-weight="500">Latinum</text>
    <rect x="624" y="403" width="120" height="3" fill="#D4A63A"/>
    <text x="620" y="465" font-size="40" font-style="italic" fill-opacity="0.85">The Latin rosary · Latinský růženec</text>
  </g>
</svg>
