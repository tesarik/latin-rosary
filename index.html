<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Resolve the theme before first paint to avoid a light-mode flash.
      // Saved preference wins; otherwise follow the OS setting. Keep the key in
      // sync with src/rosary/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("ruzenec_theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <title>Rosarium</title>
    <meta name="description" content="The rosary, litanies and prayers in Latin, with an English or Czech translation one tap away. Free and offline. · Latinský růženec, litanie a modlitby s překladem." />
    <!-- Link previews. %APP_URL% is the app's absolute URL, filled in at build
         time from SITE_URL + BASE_PATH (vite.config.ts). -->
    <link rel="canonical" href="%APP_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%APP_URL%" />
    <meta property="og:site_name" content="Rosarium" />
    <meta property="og:title" content="Rosarium Latinum" />
    <meta property="og:description" content="The rosary, litanies and prayers in Latin, with an English or Czech translation one tap away. · Latinský růženec, litanie a modlitby s překladem." />
    <meta property="og:image" content="%APP_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A rosary beside the words Rosarium Latinum" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1565C0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rosarium" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <a href="%BASE_URL%en/">Latin prayers with English translation</a> ·
      <a href="%BASE_URL%cs/">Latinské modlitby s českým překladem</a>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
